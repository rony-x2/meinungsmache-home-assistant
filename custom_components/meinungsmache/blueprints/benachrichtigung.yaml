# Vorlage der Integration Meinungsmache (https://github.com/rony-x2/meinungsmache-home-assistant)
blueprint:
  name: "Meinungsmache: Neuer Artikel – Benachrichtigung"
  description: >-
    Schickt eine Benachrichtigung mit Titel, Anrisstext und Bild an die Companion-App, sobald auf
    meinungsmache.de ein passender Artikel erscheint. Tippen öffnet den Artikel.
  domain: automation
  author: Dennis Deutschkämer
  homeassistant:
    min_version: "2024.10.0"
  source_url: https://github.com/rony-x2/meinungsmache-home-assistant/blob/main/custom_components/meinungsmache/blueprints/benachrichtigung.yaml
  input:
    filter:
      name: Welche Artikel?
      icon: mdi:filter-outline
      input:
        feeds:
          name: Feeds
          description: >-
            In welchen Feeds der Artikel erscheinen muss. Es zählen nur Feeds, die auch in der
            Integration eingerichtet sind. Ein Artikel, der in mehreren gewählten Feeds erscheint, löst
            nur einmal aus.
          default: [all]
          selector:
            select:
              multiple: true
              mode: list
              options:
                - label: Alle Artikel
                  value: all
                - label: Startseite
                  value: frontpage
                - label: Politik
                  value: politik
                - label: Gesellschaft
                  value: gesellschaft
                - label: Meinungen
                  value: meinungen
                - label: Good News
                  value: good-news
                - label: International
                  value: international
                - label: Wirtschaft
                  value: wirtschaft
                - label: Umwelt
                  value: umwelt
                - label: Sport
                  value: sport
                - label: Medien
                  value: medien
                - label: Migration
                  value: migration
                - label: AfD
                  value: afd
                - label: CDU
                  value: cdu
                - label: SPD
                  value: spd
                - label: Die Linke
                  value: die-linke
                - label: Friedrich Merz
                  value: friedrich-merz
                - label: Donald Trump
                  value: donald-trump
                - label: Europäische Union
                  value: europaeische-union
                - label: Frankreich
                  value: frankreich
                - label: Großbritannien
                  value: grossbritannien
                - label: China
                  value: china
                - label: Gaza
                  value: gaza
                - label: Iran
                  value: iran
                - label: Russland
                  value: russland
                - label: Sudan
                  value: sudan
                - label: Ukraine
                  value: ukraine
                - label: USA
                  value: usa
        art:
          name: Art
          default: alle
          selector:
            select:
              mode: list
              options:
                - label: Alle Artikel
                  value: alle
                - label: Nur eigene Artikel der Redaktion (mit Autorin oder Autor)
                  value: eigene
                - label: Nur exklusive Artikel
                  value: exklusiv
        stichwoerter:
          name: Stichwörter (optional)
          description: >-
            Kommagetrennt, z. B. „Trump, Weißes Haus“. Der Artikel muss mindestens eines davon in Titel
            oder Anrisstext enthalten. Groß- und Kleinschreibung spielt keine Rolle. Leer = kein Filter.
          default: ""
          selector:
            text: {}
    ziel:
      name: Benachrichtigung
      icon: mdi:cellphone-message
      input:
        geraet:
          name: Gerät
          description: Ein Smartphone oder Tablet mit der Home-Assistant-App.
          selector:
            device:
              integration: mobile_app
        bild_zeigen:
          name: Bild mitschicken
          default: true
          selector:
            boolean: {}
        kanal:
          name: Kanal (Android)
          description: Benachrichtigungskanal, um Ton und Wichtigkeit in Android einzustellen.
          default: Meinungsmache
          selector:
            text: {}

triggers:
  - trigger: event
    event_type: meinungsmache_neuer_artikel

variables:
  feeds_wahl: !input feeds
  art_wahl: !input art
  stichwoerter_wahl: !input stichwoerter
  artikel: "{{ trigger.event.data }}"
  titel: "{{ trigger.event.data.titel }}"
  link: "{{ trigger.event.data.link }}"
  teaser: "{{ trigger.event.data.teaser }}"
  bild: "{{ trigger.event.data.bild }}"
  autor: "{{ trigger.event.data.autor }}"
  feed_name: "{{ trigger.event.data.feed_name }}"
  geraet_id: !input geraet
  bild_zeigen: !input bild_zeigen
  kanal: !input kanal
  dienst: "notify.mobile_app_{{ device_attr(geraet_id, 'name') | slugify }}"
  vorspann: >-
    {% if trigger.event.data.exklusiv %}Exklusiv · {% elif trigger.event.data.eigen %}{{ trigger.event.data.autor }} · {% endif %}{{ trigger.event.data.feed_name }}

conditions:
  - alias: Feed passt und wurde für diese Auswahl noch nicht gemeldet
    condition: template
    value_template: >-
      {% set d = trigger.event.data %}
      {{ (d.feeds | select('in', feeds_wahl) | list | count) > 0
         and (d.frueher | default([]) | select('in', feeds_wahl) | list | count) == 0 }}
  - alias: Art passt
    condition: template
    value_template: >-
      {% set d = trigger.event.data %}
      {{ art_wahl == 'alle' or (art_wahl == 'eigene' and d.eigen) or (art_wahl == 'exklusiv' and d.exklusiv) }}
  - alias: Stichwort passt
    condition: template
    value_template: >-
      {% set woerter = stichwoerter_wahl.split(',') | map('trim') | reject('eq', '') | map('lower') | list %}
      {% set text = (trigger.event.data.titel ~ ' ' ~ (trigger.event.data.teaser or '')) | lower %}
      {{ woerter | count == 0 or (woerter | select('in', text) | list | count) > 0 }}

actions:
  - action: "{{ dienst }}"
    data:
      title: "{{ titel }}"
      message: "{{ vorspann }}{% if teaser %}: {{ teaser }}{% endif %}"
      data: >-
        {% set d = {'url': link, 'clickAction': link, 'group': 'meinungsmache', 'channel': kanal,
                    'tag': 'meinungsmache-' ~ (link | regex_replace('^.*/', ''))} %}
        {% if bild_zeigen and bild %}{% set d = dict(d, image=bild, attachment={'url': bild}) %}{% endif %}
        {{ d }}

mode: queued
max: 20
